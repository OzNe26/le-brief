name: Fil d'actus en direct

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch:
  push:
    paths:
      - "scripts/news_sources.json"
      - "scripts/update_news.py"
      - ".github/workflows/news.yml"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les flux
        run: python3 scripts/update_news.py
      - name: Enregistrer
        run: |
          if [ -z "$(git status --porcelain -- news_live.json)" ]; then echo "Rien de nouveau"; exit 0; fi
          git config user.name "le-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_live.json
          git commit -q -m "Fil en direct $(date -u +%H:%M) UTC"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
