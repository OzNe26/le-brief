name: Fil d'actus en direct

on:
  schedule:
    - cron: "*/15 * * * *"   # relance de sécurité ; chaque lancement actualise lui-même toutes les 5 min
  workflow_dispatch:
  push:
    paths:
      - "scripts/news_sources.json"
      - "scripts/update_news.py"
      - ".github/workflows/news.yml"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualiser toutes les 5 minutes (le robot reste actif ~50 min)
        run: |
          # Le planificateur de GitHub décale ou saute souvent les lancements :
          # chaque lancement actualise donc lui-même le fil 10 fois, toutes les 5 minutes.
          # Un nouveau lancement remplace le précédent (concurrency), donc jamais de trou.
          git config user.name "le-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in $(seq 1 10); do
            git pull --rebase -q origin main || true
            python3 scripts/update_news.py || echo "Échec lecture des flux"
            if [ -n "$(git status --porcelain -- news_live.json)" ]; then
              git add news_live.json
              git commit -q -m "Fil en direct $(date -u +%H:%M) UTC"
              for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
            else
              echo "Rien de nouveau"
            fi
            [ "$n" -lt 10 ] && sleep 300
          done
