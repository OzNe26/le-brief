name: Fil d'actus en direct

on:
  schedule:
    - cron: "*/15 * * * *"   # relance de sécurité ; chaque lancement actualise lui-même toutes les 5 min
  workflow_dispatch:
  push:
    paths:
      - "scripts/news_sources.json"
      - "scripts/update_news.py"
      - "scripts/alerts.py"
      - "scripts/vapid.py"
      - ".github/workflows/news.yml"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false   # le lancement suivant attend la fin du précédent : relais sans coupure

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils pour les notifications du site
        run: |
          pip install -q "pywebpush==2.*" || echo "pywebpush indisponible, notifications du site sautées pour ce passage"
      - name: Actualiser toutes les 5 minutes (le robot reste actif ~50 min puis passe le relais)
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          # Le planificateur de GitHub décale ou saute souvent les lancements :
          # chaque lancement actualise donc lui-même le fil 10 fois, toutes les 5 minutes.
          # Le lancement suivant attend son tour puis prend le relais (concurrency), donc pas de trou.
          git config user.name "le-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in $(seq 1 11); do
            git pull --rebase -q origin main || true
            python3 scripts/update_news.py || echo "Échec lecture des flux"
            python3 scripts/alerts.py || echo "Échec des alertes"
            if [ -n "$(git status --porcelain -- news_live.json alerts_state.json)" ]; then
              git add news_live.json; [ -f alerts_state.json ] && git add alerts_state.json
              git commit -q -m "Fil en direct $(date -u +%H:%M) UTC"
              for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done || true
            else
              echo "Rien de nouveau"
            fi
            if [ "$n" -lt 11 ]; then sleep 300; fi
          done
          echo "Terminé"
