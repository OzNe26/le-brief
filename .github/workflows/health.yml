name: Surveillance des robots

on:
  schedule:
    - cron: "17,47 * * * *"   # toutes les 30 min (GitHub peut décaler)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils pour les notifications
        run: |
          pip install -q "pywebpush==2.*" || echo "pywebpush indisponible"
      - name: Vérifier que tout se met à jour
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: python3 scripts/health.py
      - name: Enregistrer l'état
        run: |
          if [ -z "$(git status --porcelain -- health_state.json)" ]; then exit 0; fi
          git config user.name "le-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health_state.json
          git commit -q -m "Surveillance des robots $(date -u +%H:%M) UTC"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done || true
