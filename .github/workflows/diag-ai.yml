name: Diagnostic Dataroma 2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; LeBriefInvest/1.0; +https://ozne26.github.io/le-brief/)"
          curl -sSL -m 30 -A "$UA" "https://www.dataroma.com/m/managers.php" -o mg.html; python3 -c "
          import re,html;s=open('mg.html',errors='ignore').read();print(len(s));print([(a,re.sub('<[^>]+>','',b).strip()[:40]) for a,b in re.findall(r'holdings\.php\?m=([A-Za-z0-9_-]+)[^>]*>(.*?)</a>',s,re.S)][:90])"
          curl -sSL -m 30 -A "$UA" "https://www.dataroma.com/m/allact.php?typ=a" -o act.html; python3 -c "
          import re;s=open('act.html',errors='ignore').read();print(len(s));print(re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',s[s.find('<table'):s.find('<table')+3000]))[:1500])"
