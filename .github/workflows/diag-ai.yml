name: Diagnostic HoldLens
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="LeBriefInvest/1.0 (+https://ozne26.github.io/le-brief/)"
          curl -sSL -m 30 -A "$UA" https://holdlens.com/api/v1/managers.json -o m.json -w "managers %{http_code}\n"; python3 -c "
          import json;d=json.load(open('m.json'));print(d.get('quarter'),len(d['data']));print([(x['slug'],x['name'],x.get('fund')) for x in d['data']])" 2>&1 | head -4
          curl -sSL -m 30 -A "$UA" https://holdlens.com/api/v1/managers/warren-buffett.json -o b.json -w "buffett %{http_code}\n"; python3 -c "
          import json;d=json.load(open('b.json'));x=d.get('data',d);print(list(x.keys()));print(json.dumps(x,ensure_ascii=False)[:1800])" 2>&1 | head -6
          curl -sSL -m 30 -A "$UA" -o /dev/null -w "dataroma %{http_code}\n" "https://www.dataroma.com/m/holdings.php?m=BRK"
