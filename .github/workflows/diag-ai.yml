name: Diagnostic site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          echo "== robots"; curl -sSL -A "$UA" https://www.mywalletfinance.com/robots.txt | head -30
          echo "== home"; curl -sSL -A "$UA" https://www.mywalletfinance.com/ -o home.html -w "%{http_code} %{url_effective}\n"; wc -c home.html
          grep -oiE '<link[^>]+(rss|atom)[^>]*>' home.html | head; grep -oiE 'generator" content="[^"]+"|wp-content|ghost|webflow|framer|substack|wix|squarespace|bubble|next' home.html | sort | uniq -c | head
          grep -oE 'href="[^"]*(article|blog|actu|news|post|analyse)[^"]*"' home.html | sort -u | head -20
          grep -oiE '<title>[^<]*' home.html
          for u in feed rss rss.xml feed.xml atom.xml blog/rss.xml sitemap.xml; do printf "%s " $u; curl -sSL -A "$UA" -o /dev/null -w "%{http_code} %{content_type}\n" https://www.mywalletfinance.com/$u; done
