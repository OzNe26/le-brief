name: Diagnostic IA
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'P'
          import os, json, urllib.request
          tok=os.environ["GITHUB_TOKEN"]
          for acc in [None,"application/json","application/vnd.github+json"]:
            for model in ["openai/gpt-4o-mini","openai/gpt-4.1-mini"]:
              h={"Authorization":"Bearer "+tok,"Content-Type":"application/json"}
              if acc: h["Accept"]=acc
              body=json.dumps({"model":model,"messages":[{"role":"user","content":"Dis bonjour en un mot."}]}).encode()
              try:
                r=urllib.request.urlopen(urllib.request.Request("https://models.github.ai/inference/chat/completions",data=body,headers=h,method="POST"),timeout=60)
                print(acc,model,r.status,r.geturl(),dict(r.headers).get("Content-Type"),r.read()[:300])
              except urllib.error.HTTPError as e:
                print(acc,model,"HTTP",e.code,e.read()[:300])
              except Exception as e: print(acc,model,"ERR",e)
          P
          curl -sS -i https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Bonjour"}]}' | head -c 1200
