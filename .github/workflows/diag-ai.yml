name: Diagnostic alertes 2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          python3 - <<'P'
          import os,json,urllib.request,re
          s=os.environ["ALERT_SECRET"]; t=s.strip()
          print("longueur brute",len(s),"après nettoyage",len(t),"caractères hors hexa :",len(re.sub(r"[0-9a-f]","",t)))
          K="sb_publishable_N42bTU1DF11LH9mC7K6QYQ_POOJ2ZK2"
          req=urllib.request.Request("https://rxuhvllidrjifyporkao.supabase.co/rest/v1/rpc/robot_alert_subs",data=json.dumps({"p_secret":t}).encode(),method="POST",headers={"apikey":K,"Authorization":"Bearer "+K,"Content-Type":"application/json"})
          try: print("réponse :",json.loads(urllib.request.urlopen(req).read()).__class__.__name__,"OK")
          except Exception as e: print("erreur",e, getattr(e,'read',lambda:b'')()[:200])
          P
          K=sb_publishable_N42bTU1DF11LH9mC7K6QYQ_POOJ2ZK2
          curl -sS -w " HTTP=%{http_code}\n" "https://rxuhvllidrjifyporkao.supabase.co/rest/v1/robot_secret?select=id" -H "apikey: $K" -H "Authorization: Bearer $K" | head -c 300
