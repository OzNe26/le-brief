name: diag live
on: { workflow_dispatch: {}, push: { paths: [".github/workflows/diag-ai.yml", "scripts/diag_live.py"] } }
concurrency: { group: diag, cancel-in-progress: true }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q websockets && python3 scripts/diag_live.py
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
