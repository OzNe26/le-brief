name: Diagnostic IA
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          echo "== Groq models"; curl -sS https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY" | python3 -c "import json,sys;print([m['id'] for m in json.load(sys.stdin)['data']])"
          echo "== Mistral models"; curl -sS https://api.mistral.ai/v1/models -H "Authorization: Bearer $MISTRAL_API_KEY" | python3 -c "import json,sys;d=json.load(sys.stdin);print([m['id'] for m in d.get('data',[])] or d)" | cut -c1-1500
          for m in mistral-small-latest open-mistral-nemo mistral-medium-latest; do echo "== $m"; curl -sS -i https://api.mistral.ai/v1/chat/completions -H "Authorization: Bearer $MISTRAL_API_KEY" -H "Content-Type: application/json" -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Bonjour\"}],\"max_tokens\":20}" | grep -iE "^HTTP|ratelimit|\"content\"|message" | cut -c1-300; sleep 3; done
