name: Diagnostic sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          D=$(date -u -d "+3 day" +%Y-%m-%d)
          echo "== nasdaq $D"; curl -sS -m 20 -A "$UA" -H "Accept: application/json" "https://api.nasdaq.com/api/calendar/earnings?date=$D" | python3 -c "import json,sys;d=json.load(sys.stdin);r=(d.get('data') or {}).get('rows') or [];print(len(r),[ (x['symbol'],x.get('time'),x.get('marketCap')) for x in r[:8]])" 2>&1 | head -3
          echo "== ff"; curl -sS -m 20 -A "$UA" https://nfs.faireconomy.media/ff_calendar_thisweek.json | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d));print([ (x['title'],x['country'],x['date'],x['impact']) for x in d if x['impact']=='High'][:12])" 2>&1 | head -3
          echo "== ff next"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" -A "$UA" https://nfs.faireconomy.media/ff_calendar_nextweek.json
          echo "== llama emissions"; curl -sS -m 30 -A "$UA" https://api.llama.fi/emissions | python3 -c "
          import json,sys,time;d=json.load(sys.stdin);print(type(d),len(d));x=d[0] if isinstance(d,list) else d;print(list(x.keys())[:20] if isinstance(x,dict) else x)
          now=time.time();ev=[]
          for p in d:
            for e in (p.get('events') or [])[:200]:
              t=e.get('timestamp') or 0
              if now<t<now+14*86400: ev.append((p.get('name'),t,e.get('noOfTokens'),e.get('description','')[:60]))
          print(len(ev), sorted(ev,key=lambda z:z[1])[:6])" 2>&1 | head -6
          echo "== ntfy"; curl -sS -m 20 -H "Title: Test Le Brief" -d "test" https://ntfy.sh/lebrief-diag-$RANDOM$RANDOM -o /dev/null -w "%{http_code}\n"
