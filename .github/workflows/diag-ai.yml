name: Clé publique des notifications
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          pip install -q cryptography
          python3 scripts/vapid.py
