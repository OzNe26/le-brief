name: Analyse quotidienne des marchés

on:
  schedule:
    - cron: "50 5 * * *"    # vers 7h (heure de Paris en hiver) : avant l'ouverture européenne
    - cron: "40 21 * * *"   # vers 22h40 : après la clôture de Wall Street
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_analysis.py"
      - "scripts/gemini.py"
      - "scripts/avis_ia.py"
      - ".github/workflows/analysis.yml"

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyser les 10 actifs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/update_analysis.py
      - name: Enregistrer
        run: |
          if [ -z "$(git status --porcelain -- analysis.json logos)" ]; then echo "Rien de nouveau"; exit 0; fi
          git config user.name "le-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis.json logos/assets 2>/dev/null || git add analysis.json
          git commit -q -m "Analyse des marchés $(date -u +%d/%m\ %H:%M) UTC"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
