name: Mise à jour audio (radios + podcasts)

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:          # bouton "Run workflow" dans l'onglet Actions
  push:
    paths:
      - "scripts/audio_sources.json"
      - "scripts/update_audio.py"

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer audio.json
        run: python3 scripts/update_audio.py
      - name: Enregistrer si changement
        run: |
          if git diff --quiet -- audio.json && git ls-files --error-unmatch audio.json >/dev/null 2>&1; then
            echo "Rien de nouveau"; exit 0
          fi
          git config user.name "le-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio.json
          git commit -m "MAJ audio (radios + podcasts)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
